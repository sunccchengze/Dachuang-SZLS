<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>8.23 组会偷师特别展示 · 气动流线势流避障与计算网格交互引擎</title>
  <style>
    :root {
      --ink: #0b0e0d;
      --paper: #e6ebe1;
      --teal: #86b9aa;
      --teal-bright: #b5ded0;
      --yellow: #e7c85b;
      --rust: #c5684a;
      --line: rgba(220, 232, 222, 0.15);
      --line-strong: rgba(220, 232, 222, 0.3);
      --mono: 'DM Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #101413;
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 悬浮学术面板 */
    .hud-panel {
      position: absolute;
      top: 24px; left: 24px;
      background: rgba(21, 26, 24, 0.88);
      border: 1px solid var(--line-strong);
      padding: 18px 24px;
      backdrop-filter: blur(10px);
      z-index: 10;
      max-width: 480px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--paper);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hud-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--yellow);
      letter-spacing: 0.14em;
    }
    .hud-desc {
      font-size: 12px;
      color: var(--teal);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .hud-metric .num {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--teal-bright);
    }
    .hud-metric .label {
      font-size: 11px;
      color: rgba(230, 235, 225, 0.6);
      margin-top: 2px;
    }
    .back-btn {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(21, 26, 24, 0.88);
      border: 1px solid var(--line-strong);
      color: var(--paper);
      padding: 8px 16px;
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      z-index: 10;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--teal);
      color: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .footer-bar {
      position: absolute;
      bottom: 18px; left: 24px; right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(230, 235, 225, 0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>

<a href="index.html" class="back-btn">← 返回工作台首页</a>

<div class="hud-panel">
  <div class="hud-title">
    <span>气动探针流场与势流避障计算网格交互引擎</span>
    <span class="hud-tag">AERODYNAMIC CANVAS</span>
  </div>
  <div class="hud-desc">
    致敬并吸收自 <code>turbine-blade-ai-platform</code> 独门精髓：鼠标移动时触发气流势流绕障偏转，网格节点指尖感应发亮；点击屏幕即可生成动量压力涟漪！
  </div>
  <div class="hud-grid">
    <div class="hud-metric">
      <div class="num" id="fpsVal">60.0</div>
      <div class="label">当前推理帧率 (FPS)</div>
    </div>
    <div class="hud-metric">
      <div class="num" id="linesVal">48</div>
      <div class="label">流线粒子数量</div>
    </div>
    <div class="hud-metric">
      <div class="num">&lt; 0.5 ms</div>
      <div class="label">响应插值延时</div>
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div class="footer-bar">
  <span>MOUSE HOVER: 势流偶极子偏转 / GRID NODE LIGHTING</span>
  <span>CLICK / TAP: 触发压力波同心波纹</span>
  <span>8.23 组会展示专属 · 孙承泽 · 西安交通大学大创项目</span>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // 鼠标目标与惯性追溯 (LERP)
  const mouse = { x: width / 2, y: height / 2, tx: width / 2, ty: height / 2, active: false };
  window.addEventListener('mousemove', e => {
    mouse.tx = e.clientX;
    mouse.ty = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', () => { mouse.active = false; });

  // 压力波涟漪
  const ripples = [];
  window.addEventListener('click', e => {
    ripples.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 0.8 });
  });

  // 初始化 48 条模拟进气流线
  const N_LINES = 48;
  const lines = [];
  for (let i = 0; i < N_LINES; i++) {
    lines.push({
      y0: (height / (N_LINES + 1)) * (i + 1),
      speed: 2 + Math.random() * 1.5,
      offset: Math.random() * Math.PI * 2
    });
  }

  // 空间 3 台风机障点布局
  const turbines = [
    { x: 0.35, y: 0.35, label: 'T1 (+30°)' },
    { x: 0.55, y: 0.50, label: 'T2 (+20°)' },
    { x: 0.75, y: 0.65, label: 'T3 (0°)' }
  ];

  let lastT = performance.now();
  let frameCount = 0;
  let fps = 60;

  function draw() {
    const now = performance.now();
    const dt = (now - lastT) / 1000;
    lastT = now;
    frameCount++;
    if (frameCount % 20 === 0) {
      fps = Math.round(1 / Math.max(0.001, dt));
      const el = document.getElementById('fpsVal');
      if (el) el.textContent = fps.toFixed(1);
    }

    // LERP 惯性追踪
    mouse.x += (mouse.tx - mouse.x) * 0.15;
    mouse.y += (mouse.ty - mouse.y) * 0.15;

    // 清屏 (高级黑色墨绿底)
    ctx.fillStyle = '#101413';
    ctx.fillRect(0, 0, width, height);

    // 1. 绘制 48px CFD 几何计算网格及指尖感应发光
    const gridSize = 48;
    ctx.strokeStyle = 'rgba(220, 232, 222, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, height);
      ctx.stroke();
    }
    for (let y = 0; y < height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(width, y);
      ctx.stroke();
    }

    // 网格交点感应高亮
    for (let x = 0; x < width; x += gridSize) {
      for (let y = 0; y < height; y += gridSize) {
        const dx = x - mouse.x;
        const dy = y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          const alpha = (1 - dist / 120) * 0.65;
          ctx.fillStyle = `rgba(134, 185, 170, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 2. 惯性阻尼探照光斑
    if (mouse.active) {
      const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 220);
      grad.addColorStop(0, 'rgba(134, 185, 170, 0.18)');
      grad.addColorStop(1, 'rgba(16, 20, 19, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 220, 0, Math.PI * 2);
      ctx.fill();
    }

    // 3. 气动流线与势流避障
    ctx.lineWidth = 1.5;
    lines.forEach(l => {
      ctx.beginPath();
      const points = [];
      const steps = 60;
      for (let s = 0; s <= steps; s++) {
        const px = (width / steps) * s;
        let py = l.y0;

        // 遇到鼠标或风机的势流避障排斥
        const dx = px - mouse.x;
        const dy = py - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 160 && dist > 1) {
          const repel = (160 - dist) * 0.55;
          py += (dy / dist) * repel;
        }

        points.push({ x: px, y: py });
      }

      for (let pIdx = 0; pIdx < points.length; pIdx++) {
        if (pIdx === 0) ctx.moveTo(points[pIdx].x, points[pIdx].y);
        else ctx.lineTo(points[pIdx].x, points[pIdx].y);
      }

      ctx.strokeStyle = 'rgba(134, 185, 170, 0.28)';
      ctx.stroke();
    });

    // 4. 绘制 3 台风机几何标示与偏转轴
    turbines.forEach(tb => {
      const tx = tb.x * width;
      const ty = tb.y * height;
      const tDist = Math.sqrt((tx - mouse.x) ** 2 + (ty - mouse.y) ** 2);
      const isHover = tDist < 90;

      ctx.strokeStyle = isHover ? '#e7c85b' : 'rgba(181, 222, 208, 0.5)';
      ctx.lineWidth = isHover ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.arc(tx, ty, 26, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '700 11px var(--mono)';
      ctx.textAlign = 'center';
      ctx.fillText(tb.label, tx, ty - 35);
    });

    // 5. 压力涟漪更新
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rItem = ripples[i];
      rItem.r += 3.8;
      rItem.alpha -= 0.018;
      if (rItem.alpha <= 0) {
        ripples.splice(i, 1);
        continue;
      }
      ctx.strokeStyle = `rgba(231, 200, 91, ${rItem.alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rItem.x, rItem.y, rItem.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
