<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>优化结果 · 风电场偏航优化</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script><script src="assets/js/plotly-theme.js" defer></script></head><body>
<nav><div class="nav-inner"><div class="brand">风电场偏航优化<br><span style="font-size:11px;color:var(--sub)">可视化模块</span></div><div class="nav-links"></div></div></nav>
<section class="wrap pg-hero"><h1>🎯 优化结果</h1><p>偏航前后尾流对比、交互式偏航扫描、功率增益曲线</p></section>
<main class="wrap"><div class="grid2"><div class="card"><div class="img-grid"><img src="assets/img/opt/before.png" alt="before"><img src="assets/img/opt/after.png" alt="after"></div><div class="note">左：偏航 0°（基准）；右：偏航 25°（推荐）。</div></div>
<div class="card"><div class="controls"><label>偏航角扫描</label><input type="range" id="scanSlider" min="-30" max="30" value="-30" step="5" style="width:180px"><span id="scanLabel" style="font-size:14px;font-weight:700;color:var(--blue)">-30°</span><button class="btn" id="playBtn">▶ 播放</button></div><div id="scanField" class="plotly-container" style="height:280px"></div><div class="note">交互式偏航扫描。</div></div></div>
<div class="card" style="margin-top:18px"><div id="optCurve" class="plotly-container" style="height:280px"></div><div class="note">功率-偏航曲线。</div></div></main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/js/interp.js"></script><script src="assets/js/plotly-theme.js"></script><script src="assets/data_3d.js"></script>
<script>(function(){const m=window.WIND_DATA.multi,D3=window.WIND_3D_DATA,S=window.SURROGATE,BS=window.BlueSeq;const sl=document.getElementById('scanSlider'),lbl=document.getElementById('scanLabel');let playing=false,animId=null;const playBtn=document.getElementById('playBtn');
function render(){const yaw=parseInt(sl.value);lbl.textContent=yaw+'°';const f2d=D3&&D3.fields_2d&&D3.fields_2d[String(yaw)];if(f2d){pr('scanField',[{type:'heatmap',x:f2d.x,y:f2d.y,z:f2d.u,colorscale:BS,zmin:4,zmax:9,colorbar:{title:{text:'m/s',side:'right'},thickness:10,len:0.7,x:1.02}}],{xaxis:{title:'x (m)'},yaxis:{title:'y (m)'},height:280});}
const i8=m.wind_speeds.indexOf(8),pred=S.predict_power(yaw,8),optIdx=m.ptot[i8].indexOf(Math.max(...m.ptot[i8]));
pr('optCurve',[{x:m.yaw_angles,y:m.ptot[i8],mode:'lines',name:'总功率',line:{color:'#3b82f6',width:2.5},fill:'tozeroy',fillcolor:'rgba(59,130,246,0.06)'},{x:m.yaw_angles,y:m.p1[i8],mode:'lines',name:'P₁',line:{color:'#6366f1',width:1.5,dash:'dot'}},{x:m.yaw_angles,y:m.p2[i8],mode:'lines',name:'P₂',line:{color:'#2563eb',width:1.5,dash:'dot'}},{x:[yaw],y:[pred.ptot],mode:'markers',name:'当前',marker:{size:14,color:'#93c5fd',line:{color:'#0f172a',width:2}}}],{xaxis:{title:'偏航角 (°)'},yaxis:{title:'功率 (kW)'},height:280,annotations:[{x:m.yaw_angles[optIdx],y:m.ptot[i8][optIdx],text:'最优 '+m.yaw_angles[optIdx]+'°',showarrow:true,arrowhead:2,arrowcolor:'#0891b2',font:{color:'#0891b2',size:11},ax:0,ay:-25}]});}
sl.oninput=render;playBtn.onclick=()=>{if(playing){playing=false;playBtn.textContent='▶ 播放';if(animId)clearInterval(animId);return;}playing=true;playBtn.textContent='⏸ 暂停';sl.value=-30;animId=setInterval(()=>{let v=parseInt(sl.value)+5;if(v>30)v=-30;sl.value=v;render();},500);};render();})();</script>
<script src="assets/js/nav.js"></script></body></html>
