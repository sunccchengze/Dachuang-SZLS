<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>功率需求跟踪 · 风电场偏航优化</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script><script src="assets/js/plotly-theme.js" defer></script></head><body>
<nav><div class="nav-inner"><div class="brand">风电场偏航优化<br><span style="font-size:11px;color:var(--sub)">可视化模块</span></div><div class="nav-links"></div></div></nav>
<section class="wrap pg-hero"><h1>🎛️ 功率需求跟踪</h1><p>输入电网目标功率，系统自动搜索满足需求的最优偏航角</p></section>
<main class="wrap"><div class="grid2"><div class="card"><div class="controls"><label>来流风速 U∞</label><select id="ptU"><option value="6">6 m/s</option><option value="8" selected>8 m/s</option><option value="10">10 m/s</option><option value="12">12 m/s</option></select><label>目标功率</label><input type="number" id="ptT" value="2400" step="10" min="0" style="width:110px"><span style="font-size:12px;color:var(--sub)">kW</span></div><div id="gaugePlot" class="plotly-container" style="height:260px"></div><div id="curvePlot" class="plotly-container" style="height:220px;margin-top:8px"></div><div class="note" id="ptNote"></div></div>
<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="stat"><div class="v blue" id="ptYaw">–</div><div class="k">推荐偏航角</div></div><div class="stat"><div class="v cyan" id="ptPow">–</div><div class="k">实际总功率(kW)</div></div><div class="stat"><div class="v indigo" id="ptErr">–</div><div class="k">跟踪误差</div></div><div class="stat"><div class="v" id="ptBase">–</div><div class="k">0° 基准(kW)</div></div></div><div class="note" style="margin-top:16px">接口：<span class="code" style="display:block;margin-top:8px">find_yaw_for_target(target_power, U_inf) -> (best_yaw, actual_power, error_pct)</span></div></div></div></main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/js/interp.js"></script><script src="assets/js/plotly-theme.js"></script>
<script>(function(){const S=window.SURROGATE,m=window.WIND_DATA.multi;const ptU=document.getElementById('ptU'),ptT=document.getElementById('ptT');
function render(){const u=+ptU.value||8,t=+ptT.value||0,r=S.find_yaw_for_target(t,u);document.getElementById('ptYaw').textContent=r.yaw+'°';document.getElementById('ptPow').textContent=Math.round(r.ptot);document.getElementById('ptErr').textContent=(r.error>=0?'+':'')+r.error.toFixed(1)+'%';document.getElementById('ptBase').textContent=Math.round(r.base);document.getElementById('ptNote').innerHTML=`风速 ${u} m/s：基准(0°)≈${Math.round(r.base)} kW，推荐偏航 <b>${r.yaw}°</b> 后≈<b>${Math.round(r.ptot)} kW</b>。`;
const maxP=Math.max(r.ptot,r.base,t)*1.15,frac=Math.max(0,Math.min(1,r.ptot/maxP)),fracT=Math.max(0,Math.min(1,t/maxP)),angV=180-frac*180,angT=180-fracT*180;
function arcR(cx,cy,r,a0,a1){const d2r=Math.PI/180,x0=cx+r*Math.cos(a0*d2r),y0=cy+r*Math.sin(a0*d2r),x1=cx+r*Math.cos(a1*d2r),y1=cy+r*Math.sin(a1*d2r);return `M${x0} ${y0} A${r} ${r} 0 ${Math.abs(a1-a0)>180?1:0} 1 ${x1} ${y1}`;}
const cx=200,cy=190,r=140;const gCol=frac>=0.9?'#0891b2':frac>=0.6?'#3b82f6':'#2563eb';
pr('gaugePlot',[{type:'path',path:arcR(cx,cy,r,180,0),line:{color:'rgba(255,255,255,0.05)',width:22},fillcolor:'rgba(255,255,255,0.02)',showlegend:false},{type:'path',path:arcR(cx,cy,r,180,angV),line:{color:gCol,width:22},fillcolor:'rgba(0,0,0,0)',showlegend:false},{type:'path',path:arcR(cx,cy,r-40,angT-1,angT+1),line:{color:'#7c3aed',width:4},fillcolor:'rgba(0,0,0,0)',showlegend:false},{x:[cx],y:[cy-30],mode:'text',text:[Math.round(r.ptot)+''],textfont:{size:28,color:'#e2e8f0'},showlegend:false},{x:[cx],y:[cy-55],mode:'text',text:['实际总功率 (kW)'],textfont:{size:12,color:'#94a3b8'},showlegend:false},{x:[cx],y:[cy+10],mode:'text',text:['目标 '+Math.round(t)+' kW'],textfont:{size:11,color:'#7c3aed'},showlegend:false}],{xaxis:{range:[0,400],showgrid:false,zeroline:false,showticklabels:false},yaxis:{range:[0,210],showgrid:false,zeroline:false,showticklabels:false},height:260,margin:{l:0,r:0,t:5,b:0},showlegend:false});
const iU=m.wind_speeds.indexOf(u);if(iU>=0){pr('curvePlot',[{x:m.yaw_angles,y:m.ptot[iU],mode:'lines',name:'总功率',line:{color:'#3b82f6',width:2.5},fill:'tozeroy',fillcolor:'rgba(59,130,246,0.06)'},{x:[m.yaw_angles[0],m.yaw_angles[m.yaw_angles.length-1]],y:[t,t],mode:'lines',name:'目标',line:{color:'#7c3aed',width:1.5,dash:'dash'}},{x:[r.yaw],y:[r.ptot],mode:'markers',name:'推荐',marker:{size:12,color:'#0891b2',line:{color:'#0f172a',width:2}}}],{xaxis:{title:'偏航角 (°)'},yaxis:{title:'功率 (kW)'},height:220});}}
ptU.onchange=render;ptT.oninput=render;render();})();</script>
<script src="assets/js/nav.js"></script></body></html>
