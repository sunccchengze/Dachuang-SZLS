<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>尾流分析 · 风电场偏航优化</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body>
<nav><div class="nav-inner"><div class="brand">风电场偏航优化<br><span style="font-size:11px;color:var(--sub)">可视化模块</span></div>
<div class="nav-links"><a href="index.html">首页</a><a href="wake.html" class="active">尾流</a><a href="optimization.html">优化</a><a href="overview.html">总览</a><a href="3d_surface.html">3D曲面</a><a href="3d_volume.html">3D体</a><a href="heatmap.html">热力矩阵</a><a href="solver.html">求解器</a><a href="pod.html">POD</a><a href="array.html">阵列</a><a href="power_tracking.html">功率跟踪</a><a href="dashboard.html">Dashboard</a><a href="windrose.html">风玫瑰</a><a href="model.html">模型精度</a><a href="interface.html">接口</a></div></div></nav>
<section class="wrap pg-hero"><h1>📊 尾流分析</h1><p>交互式速度场云图，代理模型实时预测任意偏航角下的功率输出</p></section>
<main class="wrap">
  <!-- KPI row -->
  <div class="stats-bar" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card"><p class="stat-number" id="kP1">–</p><p class="stat-label">上游风机 P₁ (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kP2">–</p><p class="stat-label">下游风机 P₂ (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kPtot">–</p><p class="stat-label">总功率 (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kGain">–</p><p class="stat-label">相对基准增益</p></div>
  </div>
  <div class="grid2">
    <!-- Flow field -->
    <div class="card">
      <div class="controls">
        <label>偏航角 γ₁</label>
        <input type="range" id="yawSlider" min="-30" max="30" value="0" step="5" style="width:200px">
        <span id="yawLabel" style="font-size:14px;font-weight:700;color:var(--blue)">0°</span>
      </div>
      <div id="fieldPlot" class="plotly-container" style="height:420px"></div>
      <div class="note">尾流速度场（FLORIS GCH 模型）。拖动偏航角滑块实时观察流场变化。下游机尾流随偏航偏移，是功率增益的来源。</div>
    </div>
    <!-- Power curves -->
    <div class="card">
      <div id="powerPlot" class="plotly-container" style="height:210px"></div>
      <div id="splitPlot" class="plotly-container" style="height:210px;margin-top:12px"></div>
      <div class="note">上：总功率 vs 偏航角，红点为当前；下：P₁/P₂ 分解。代理模型 <code>predict_power(yaw, U)</code> 实时预测。</div>
    </div>
  </div>
</main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/data_3d.js"></script><script src="assets/js/interp.js"></script>
<script>
(function(){
  const W=window.WIND_DATA, S=window.SURROGATE, D3=window.WIND_3D_DATA;
  const m=W.multi;
  const yawSlider=document.getElementById('yawSlider');
  const yawLabel=document.getElementById('yawLabel');

  // 找最近偏航角
  function nearestYaw(v){return m.yaw_angles.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);}

  function render(){
    const yaw=parseInt(yawSlider.value);
    yawLabel.textContent=yaw+'°';
    const pred=S.predict_power(yaw,8);
    const base=S.predict_power(0,8);
    const gain=((pred.ptot-base.ptot)/base.ptot*100);
    document.getElementById('kP1').textContent=Math.round(pred.p1);
    document.getElementById('kP2').textContent=Math.round(pred.p2);
    document.getElementById('kPtot').textContent=Math.round(pred.ptot);
    document.getElementById('kGain').textContent=(gain>=0?'+':'')+gain.toFixed(1)+'%';

    // Flow field heatmap
    const f2d=D3&&D3.fields_2d&&D3.fields_2d[String(yaw)];
    if(f2d){
      Plotly.newPlot('fieldPlot',[{
        type:'heatmap',x:f2d.x,y:f2d.y,z:f2d.u,
        colorscale:'RdBu_r',zmin:4,zmax:9,
        colorbar:{title:{text:'m/s',side:'right'},thickness:12,len:0.8,x:1.02},
        hovertemplate:'x: %{x:.0f}m  y: %{y:.0f}m  u: %{z:.2f} m/s<extra></extra>'
      },{
        type:'scatter',x:[0,630],y:[0,0],mode:'markers+text',
        marker:{size:14,color:'#e2e8f0',symbol:'triangle-up',line:{color:'#1e3a6e',width:1.5}},
        text:['  风机1(可调)','  风机2(固定0°)'],textposition:'middle right',
        textfont:{size:11,color:'#e2e8f0'},showlegend:true,name:'风机位置'
      }],{
        xaxis:{title:'顺风方向 x (m)',color:'#94a3b8',gridcolor:'#1e293b'},
        yaxis:{title:'横向 y (m)',color:'#94a3b8',gridcolor:'#1e293b'},
        height:420,margin:{l:50,r:60,t:20,b:50},
        paper_bgcolor:'#020617',plot_bgcolor:'#0b1220',font:{color:'#94a3b8'},
        legend:{orientation:'h',y:-0.15,x:0,font:{size:10},bgcolor:'rgba(0,0,0,0)'}
      },{responsive:true});
    }

    // Total power curve
    const i8=m.wind_speeds.indexOf(8);
    const optIdx=m.ptot[i8].indexOf(Math.max(...m.ptot[i8]));
    Plotly.newPlot('powerPlot',[{
      x:m.yaw_angles,y:m.ptot[i8],mode:'lines',name:'总功率',
      line:{color:'#3b82f6',width:2.5},fill:'tozeroy',fillcolor:'rgba(96,165,250,0.06)'
    },{
      x:[yaw],y:[pred.ptot],mode:'markers',name:'当前 '+yaw+'°',
      marker:{size:14,color:'#93c5fd',line:{color:'#e2e8f0',width:2}}
    }],{
      xaxis:{title:'偏航角 (°)',color:'#94a3b8',gridcolor:'#1e293b'},
      yaxis:{title:'总功率 (kW)',color:'#94a3b8',gridcolor:'#1e293b'},
      height:210,margin:{l:50,r:15,t:10,b:40},
      paper_bgcolor:'#020617',plot_bgcolor:'#0b1220',font:{color:'#94a3b8'},
      showlegend:false,
      annotations:[{x:m.yaw_angles[optIdx],y:m.ptot[i8][optIdx],text:'最优 '+m.yaw_angles[optIdx]+'°',
        showarrow:true,arrowhead:2,arrowcolor:'#0891b2',font:{color:'#0891b2',size:11},ax:0,ay:-30}]
    },{responsive:true});

    // P1/P2 split
    Plotly.newPlot('splitPlot',[{
      x:m.yaw_angles,y:m.p1[i8],mode:'lines',name:'上游 P₁',
      line:{color:'#6366f1',width:2}
    },{
      x:m.yaw_angles,y:m.p2[i8],mode:'lines',name:'下游 P₂',
      line:{color:'#3b82f6',width:2}
    }],{
      xaxis:{title:'偏航角 (°)',color:'#94a3b8',gridcolor:'#1e293b'},
      yaxis:{title:'功率 (kW)',color:'#94a3b8',gridcolor:'#1e293b'},
      height:210,margin:{l:50,r:15,t:10,b:40},
      paper_bgcolor:'#020617',plot_bgcolor:'#0b1220',font:{color:'#94a3b8'},
      legend:{orientation:'h',y:-0.35,x:0,font:{size:10},bgcolor:'rgba(0,0,0,0)'},
      shapes:[{type:'line',x0:yaw,x1:yaw,y0:0,y1:1,yref:'paper',line:{color:'#93c5fd',width:1.5,dash:'dot'}}]
    },{responsive:true});
  }

  yawSlider.oninput=render;
  render();
})();
</script>
</body></html>
