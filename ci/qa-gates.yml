# ============================================================
# QA 门槛（GitHub Actions workflow）
#
# ⚠️ 本文件当前**不在** `.github/workflows/`，所以还不会自动跑：
#    本仓连接的 GitHub App（arena-ai-coding-agent）没有 `workflows` 权限，
#    推送 `.github/**` 会被远端拒绝（refusing to allow a GitHub App to create or
#    update workflow … without `workflows` permission）。因此把 workflow 作为
#    普通文件入库，由人一条命令启用：
#
#      mkdir -p .github/workflows
#      git mv ci/qa-gates.yml .github/workflows/qa-gates.yml && git push
#
#    启用前后都能用**本地等价闸门**（同一口径的四条命令）：
#      cd twin && npm run verify
# ============================================================
# 只跑不需要浏览器的四项（类型检查 / lint / 数据契约与渲染口径自检 / 构建）；
# 截图类（shot.mjs、perftier 帧时长）依赖 SwiftShader，在 CI 上既慢又不可比，留给本地/沙箱按 SOP 做。
name: QA gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    name: tsc · lint · selftest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # selftest 用 Node 原生类型剥离，需 ≥22.6
          cache: npm
          cache-dependency-path: twin/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc -b --noEmit)
        run: npx tsc -b --noEmit

      - name: Lint (oxlint，0 warning 0 error)
        run: npm run lint

      - name: Selftest（数据契约 + 渲染口径 + R38 证据链守卫）
        run: npm run selftest

      - name: Build (vite)
        run: npm run build

      - name: 证据链哨兵（非阻断：大文件与 0 字节图）
        run: |
          big=$(git -C .. ls-files -z '*.png' '*.jpg' '*.zip' | xargs -0 -I{} du -k "../{}" | awk '$1>3000{print}')
          if [ -n "$big" ]; then
            echo "以下入库文件 >3MB，请确认是否该走外链/LFS："; echo "$big"
          fi
          echo "docs/ 内 0 字节图片数（应为 0，selftest 亦断言）："
          find ../docs -type f -size 0 \( -name '*.png' -o -name '*.jpg' \) | wc -l
